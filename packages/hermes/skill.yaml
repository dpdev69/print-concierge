name: print-concierge
version: 0.1.0
description: Hermes shim for safe Print Concierge MCP workflows.
canonical_skill: ../../skills/print-concierge/SKILL.md
entrypoint: handler.js
mcp:
  server: print-concierge
  command: uv
  args:
    - run
    - print-concierge-mcp
tools:
  - search_archive_or_models
  - get_public_import_status
  - import_public_candidate
  - list_slicer_presets
  - list_printers
  - get_printer_status
  - prepare_print_plan
  - create_print_request
  - get_print_request_status
  - queue_print_request
  - get_job_status
safety:
  user_confirmation_before_queue: required
  one_sensitive_scoped_tool: queue_print_request(request_id)
  scoped_queue_request_only: true
  raw_queue_start_tools: forbidden
  raw_bambuddy_queue_start_pause_cancel_tools: forbidden
  mcp_host_per_call_confirmation: required
  policy_gated: true
  audited: true
  capability_mode_controlled: true
  manual_start_by_default: true
  exact_print_job_binding: required
  untrusted_model_metadata: true
  do_not_expose: Bambuddy credentials, tokens, serial numbers, access codes, camera URLs
  least_privilege: true
  no_direct_start: true
