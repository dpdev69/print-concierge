name: print-concierge
version: 0.1.0
summary: Safe Print Concierge skill package for OpenAI/Codex-style agents.
skill: ../SKILL.md
references:
  - ../references/workflow.md
  - ../references/safety.md
mcp:
  command: uv
  args:
    - run
    - print-concierge-mcp
safety:
  requires_explicit_user_confirmation: true
  one_sensitive_scoped_tool: queue_print_request(request_id)
  scoped_queue_request_only: true
  raw_bambuddy_queue_start_pause_cancel_tools: forbidden
  mcp_host_per_call_confirmation: required
  policy_gated: true
  audited: true
  capability_mode_controlled: true
  manual_start_by_default: true
  no_direct_start: true
  treats_model_metadata_as_untrusted: true
